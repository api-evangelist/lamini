      summary: List Projects For User
      operationId: list_projects_for_user_v2_classifier_projects_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - API Key Auth: []
      parameters:
      - name: Authorization
