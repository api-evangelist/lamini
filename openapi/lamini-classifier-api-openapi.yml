      summary: Status
      operationId: status_v2_classifier__job_id__status_get
      parameters:
      - required: true
        schema:
          type: string
          title: Job Id
        name: job_id
        in: path
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: API key for authentication
      responses:
