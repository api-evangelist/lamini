components:
  schemas:
    ClassifierV2TrainPayload:
      properties:
        name:
          type: string
          title: Name
        classifier_train_job_id:
          type: string
          title: Classifier Train Job Id
      type: object
      required:
      - name
      title: ClassifierV2TrainPayload
    ClassifierV2InitializePayload:
      properties:
        classes:
          type: object
          title: Classes
        name:
          type: string
          title: Name
        model_name:
          type: string
          title: Model Name
        examples:
          type: object
          title: Examples
      type: object
      required:
      - classes
      - name
      - model_name
      title: ClassifierV2InitializePayload
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ClassifierV2UpdateJobPayload:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
      type: object
      required:
      - job_id
      - status
      title: ClassifierV2UpdateJobPayload
    ClassifierV2RegisterPayload:
      properties:
        project_id:
          type: string
          title: Project Id
        model_id:
          type: string
          title: Model Id
        job_id:
          type: string
          title: Job Id
      type: object
      required:
      - project_id
      - model_id
      - job_id
      title: ClassifierV2RegisterPayload
    ClassifierV2ClassifyPayload:
      properties:
        prompt:
          anyOf:
          - type: string
          - items:
              type: string
            type: array
          title: Prompt
        top_n:
          type: integer
          title: Top N
        threshold:
          type: number
          title: Threshold
        metadata:
          type: boolean
          title: Metadata
      type: object
      required:
      - prompt
      title: ClassifierV2ClassifyPayload
    ClassifierV2AddPayload:
      properties:
        data:
          type: object
          title: Data
        dataset_name:
          type: string
          title: Dataset Name
        project_name:
          type: string
          title: Project Name
      type: object
      required:
      - data
      - dataset_name
      - project_name
      title: ClassifierV2AddPayload
  securitySchemes:
    APIKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Enter your API token. Get your API key from http://localhost:5001/account
