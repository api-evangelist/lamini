openapi: 3.2.0
info:
  title: Lamini Classifier API
  description: LLM inference and tuning for the enterprise. Factual LLMs. Classifier and embeddings. Deployed anywhere in 10 min.
  version: 1.13.6
security:
- APIKeyAuth: []
tags:
- name: classifier
  description: Classify text into categories.
paths:
  /v2/classifier/initialize:
    post:
      tags:
      - classifier
      summary: Initialize
      description: 'Create the project,

        kickoff generate data,

        create the project data directory'
      operationId: initialize_v2_classifier_initialize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifierV2InitializePayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - API Key Auth: []
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: API key for authentication
  /v2/classifier/add:
