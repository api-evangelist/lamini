      summary: Delete Datasets For Project
      operationId: delete_datasets_for_project_v2_classifier__project_name___dataset_name__delete
      parameters:
      - required: true
        schema:
          type: string
          title: Project Name
        name: project_name
        in: path
      - required: true
        schema:
