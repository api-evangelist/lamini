            schema:
              $ref: '#/components/schemas/ClassifierV2TrainPayload'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - API Key Auth: []
      parameters:
      - name: Authorization
        in: header
